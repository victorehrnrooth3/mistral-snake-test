<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SNAKE // RETRO</title>
<style>
  :root { --grn: #39ff14; --grn-dim: #1d7a0b; --bg: #030803; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Courier New", ui-monospace, monospace;
    touch-action: none; overscroll-behavior: none;
    display: flex; flex-direction: column; align-items: center;
    color: var(--grn); user-select: none; -webkit-user-select: none;
  }
  #hud {
    width: 100%; max-width: 520px; padding: 10px 14px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
    text-shadow: 0 0 6px var(--grn);
  }
  #hud .label { font-size: 12px; letter-spacing: 2px; opacity: .8; }
  #score, #best { font-size: 22px; font-weight: bold; }
  #wrap { position: relative; width: 100%; max-width: 520px; flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
  #screen { position: relative; }
  canvas {
    display: block; background: #02120a;
    border: 2px solid var(--grn-dim); border-radius: 6px;
    box-shadow: 0 0 24px rgba(57, 255, 20, .25), inset 0 0 40px rgba(0,0,0,.8);
  }
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 6px;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 4px);
  }
  .overlay {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(2, 10, 4, .82); border-radius: 6px;
    text-shadow: 0 0 8px var(--grn);
  }
  .overlay h1 { font-size: 34px; letter-spacing: 6px; animation: blink 1.2s steps(2) infinite; }
  .overlay p { font-size: 13px; letter-spacing: 2px; opacity: .85; line-height: 1.7; }
  .hidden { display: none !important; }
  @keyframes blink { 50% { opacity: .25; } }
  #pad {
    width: 100%; max-width: 520px; padding: 8px 0 calc(10px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px);
    gap: 8px; justify-content: center;
  }
  #pad button {
    background: rgba(57,255,20,.08); color: var(--grn); border: 2px solid var(--grn-dim);
    border-radius: 10px; font-size: 22px; font-family: inherit; text-shadow: 0 0 6px var(--grn);
    box-shadow: 0 0 10px rgba(57,255,20,.15);
  }
  #pad button:active { background: rgba(57,255,20,.3); }
  #pad .up { grid-column: 2; grid-row: 1; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: fine) and (min-width: 700px) { #pad { display: none; } }
</style>
</head>
<body>
  <div id="hud">
    <div><div class="label">SCORE</div><div id="score">0</div></div>
    <div style="text-align:right"><div class="label">BEST</div><div id="best">0</div></div>
  </div>
  <div id="wrap">
    <div id="screen">
      <canvas id="game"></canvas>
      <div id="menu" class="overlay">
        <h1>SNAKE</h1>
        <p>SWIPE OR USE THE PAD TO STEER<br>EAT THE BLOCKS. DON'T BITE YOURSELF.<br><br>TAP TO START</p>
      </div>
      <div id="over" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p id="final">SCORE 0</p>
        <p>TAP TO RETRY</p>
      </div>
      <div id="paused" class="overlay hidden">
        <h1>PAUSED</h1>
        <p>TAP TO RESUME</p>
      </div>
    </div>
  </div>
  <div id="pad">
    <button class="up" data-dir="up" aria-label="up">▲</button>
    <button class="left" data-dir="left" aria-label="left">◀</button>
    <button class="down" data-dir="down" aria-label="down">▼</button>
    <button class="right" data-dir="right" aria-label="right">▶</button>
  </div>

<script>
"use strict";
(function () {
  var COLS = 21, ROWS = 21;
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var menuEl = document.getElementById("menu");
  var overEl = document.getElementById("over");
  var pausedEl = document.getElementById("paused");
  var finalEl = document.getElementById("final");

  var CELL, W, H, dpr;
  function resize() {
    var wrap = document.getElementById("wrap");
    var availW = Math.min(wrap.clientWidth - 20, 520);
    var availH = wrap.clientHeight - 20;
    var size = Math.max(160, Math.min(availW, availH));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = H = size;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    CELL = size / COLS;
    draw();
  }

  var snake, dir, nextDir, food, score, best, speed, state, acc, lastT;
  best = parseInt(localStorage.getItem("snake_best") || "0", 10) || 0;
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 150;
    acc = 0;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }

  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  function setDir(name) {
    var d = DIRS[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("snake_best", String(best));
      }
      speed = Math.max(60, speed - 4);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = "over";
    finalEl.textContent = "SCORE " + score + (score >= best && score > 0 ? " — NEW BEST!" : "");
    overEl.classList.remove("hidden");
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (state !== "play") { lastT = t; return; }
    if (!lastT) lastT = t;
    acc += t - lastT;
    lastT = t;
    while (acc >= speed) { acc -= speed; step(); if (state !== "play") break; }
    draw();
  }

  function draw() {
    if (!CELL) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#02120a";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(57,255,20,0.06)";
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    }
    if (food) {
      ctx.fillStyle = "#ff4040";
      ctx.shadowColor = "#ff4040"; ctx.shadowBlur = 12;
      var m = CELL * 0.18;
      ctx.fillRect(food.x * CELL + m, food.y * CELL + m, CELL - 2 * m, CELL - 2 * m);
      ctx.shadowBlur = 0;
    }
    if (snake) {
      ctx.shadowColor = "#39ff14"; ctx.shadowBlur = 10;
      for (var j = snake.length - 1; j >= 0; j--) {
        var s = snake[j];
        var g = 1 - (j / snake.length) * 0.55;
        ctx.fillStyle = j === 0 ? "#aaffaa" : "rgba(57,255,20," + g.toFixed(2) + ")";
        var pad = j === 0 ? 1 : 2;
        ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      }
      ctx.shadowBlur = 0;
      var h = snake[0];
      ctx.fillStyle = "##02120a".slice(0, 7);
      var ex = 3.5;
      ctx.fillRect(h.x * CELL + CELL / 2 + (dir.x * 2 - 1) * ex - 1.5, h.y * CELL + CELL / 2 + (dir.y * 2 - 1) * ex - 1.5, 3, 3);
      ctx.fillRect(h.x * CELL + CELL / 2 - (dir.x * 2 - 1) * ex - 1.5, h.y * CELL + CELL / 2 - (dir.y * 2 - 1) * ex - 1.5, 3, 3);
    }
  }

  function start() {
    reset();
    state = "play";
    acc = 0; lastT = 0;
    menuEl.classList.add("hidden");
    overEl.classList.add("hidden");
    pausedEl.classList.add("hidden");
  }

  function tap(e) {
    if (e.target.closest && e.target.closest("#pad")) return;
    if (state === "play") {
      state = "paused";
      pausedEl.classList.remove("hidden");
    } else if (state === "paused") {
      state = "play";
      pausedEl.classList.add("hidden");
      lastT = 0;
    } else {
      start();
    }
  }

  document.getElementById("screen").addEventListener("pointerdown", tap);

  document.querySelectorAll("#pad button").forEach(function (b) {
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      if (state === "play") setDir(b.dataset.dir);
    });
  });

  var KEYS = {
    ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right"
  };
  document.addEventListener("keydown", function (e) {
    if (KEYS[e.code]) { e.preventDefault(); if (state === "play") setDir(KEYS[e.code]); }
    else if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      if (state === "play") { state = "paused"; pausedEl.classList.remove("hidden"); }
      else if (state === "paused") { state = "play"; pausedEl.classList.add("hidden"); lastT = 0; }
      else start();
    }
  });

  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (!touchStart || state !== "play") return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "play") {
      state = "paused";
      pausedEl.classList.remove("hidden");
    }
  });

  window.addEventListener("resize", resize);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  state = "menu";
  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
